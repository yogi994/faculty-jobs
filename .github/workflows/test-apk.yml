name: Test APK on emulator

# Installs the latest released APK on an Android emulator, opens it,
# taps around, and saves the crash log.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download app-latest -R ${{ github.repository }} -p faculty-jobs.apk

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r faculty-jobs.apk
            adb shell pm grant com.yogeshpandey.facultyjobs android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n com.yogeshpandey.facultyjobs/.MainActivity
            sleep 25
            adb shell pidof com.yogeshpandey.facultyjobs && echo "APP RUNNING after launch" || echo "APP NOT RUNNING after launch"
            adb exec-out screencap -p > after-launch.png
            adb shell monkey -p com.yogeshpandey.facultyjobs --pct-syskeys 0 --throttle 300 -v 150 || true
            sleep 5
            adb shell pidof com.yogeshpandey.facultyjobs && echo "APP RUNNING after taps" || echo "APP NOT RUNNING after taps"
            adb logcat -d > logcat.txt
            grep -nE "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|Expo|crash" logcat.txt | head -150 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logs
          path: |
            logcat.txt
            after-launch.png
