name: Collect jobs

on:
  schedule:
    # Every 4 hours (UTC). India time: 05:30, 09:30, 13:30, 17:30, 21:30, 01:30.
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - name: Tools to read notification PDFs (text and scanned)
        run: sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr >/dev/null
      - run: npm ci
        working-directory: collector
      - run: npm run collect
        working-directory: collector
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit updated list
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
