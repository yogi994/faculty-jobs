name: Test APK on emulator

# Installs the latest released APK on several Android versions, opens it the way a
# real user would (permission prompt not pre-granted), restarts it, forces the
# background job to run, taps around, and saves the logs.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 31, 33, 35]
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download app-latest -R ${{ github.repository }} -p faculty-jobs.apk

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api >= 33 && 'google_apis' || 'default' }}
          disable-animations: true
          script: |
            P=com.yogeshpandey.facultyjobs
            adb logcat -c
            adb install -r faculty-jobs.apk
            adb shell am start -W -n $P/.MainActivity
            sleep 20
            adb exec-out screencap -p > launch1.png
            adb shell pidof $P && echo "RUNNING after first launch" || echo "NOT RUNNING after first launch"
            adb shell input keyevent KEYCODE_ENTER || true
            adb shell input tap 540 1400 || true
            sleep 3
            adb shell am force-stop $P
            adb shell am start -W -n $P/.MainActivity
            sleep 15
            adb shell pidof $P && echo "RUNNING after relaunch" || echo "NOT RUNNING after relaunch"
            adb shell cmd jobscheduler run -f $P 0 || true
            for id in $(adb shell dumpsys jobscheduler | grep -o "$P/[^ ]*#[0-9]*" | grep -o '[0-9]*$' | sort -u); do adb shell cmd jobscheduler run -f $P $id || true; done
            sleep 10
            adb shell monkey -p $P --pct-syskeys 0 --pct-appswitch 0 --throttle 300 -v 100 || true
            sleep 5
            adb shell pidof $P && echo "RUNNING after taps" || echo "NOT RUNNING after taps"
            adb exec-out screencap -p > end.png
            adb logcat -d > logcat.txt
            grep -nE "FATAL EXCEPTION|AndroidRuntime: |ReactNativeJS: .*(Error|error)" logcat.txt | head -80 || true
            if grep -q "FATAL EXCEPTION" logcat.txt; then echo "::error::Crash on API ${{ matrix.api }}"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logs-api${{ matrix.api }}
          path: |
            logcat.txt
            *.png
